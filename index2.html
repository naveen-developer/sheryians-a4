<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Home</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            max-width: 100vw;
            font-family: monospace;
        }

        nav ul {
            display: flex;
            gap: 50px;
            font-size: 1.5rem;
            margin: 0;
        }

        nav ul li {
            list-style: none;
        }

        nav ul li a {
            color: #000;
            text-decoration: none;
        }

        .item6 .no {
            font-size: 4rem;
            margin: 0;
            font-weight: bold;
        }

        .item6 p {
            font-size: 2rem;
            margin: 0;
        }

        .item6 .sub-item1 {}

        main {
            max-width: 1200px;
            max-height: 600px;
            margin: auto;
            height: 100%;
            display: grid;
            grid-template-columns: 5% 35% 20% 20% 20%;
            grid-template-rows: 5% 10% 15% 40% 30%;
            gap: 40px;
        }

        main>div {
            border-radius: 30px;
            ;
        }

        .item1 {
            background-color: #8184D3;
            grid-row: 2 / 6;
            grid-column: 2 / 2;
            border-radius: 30px 0 30px 30px;
        }

        .item2 {

            grid-column: 3 / 6;
            grid-row: 1 / 3;
        }

        .item3 {
            background-color: lightcyan;
            grid-row: 3 / 5;
            grid-column: 3 / 5;
        }

        .item4 {
            background-color: lightgreen;
            grid-column: 3 / 4;
        }

        .item5 {
            background-color: lightsalmon;
            grid-column: 4 / 6;
        }

        .item6 {
            background-color: lightslategrey;
            grid-column: 5 / 6;
            grid-row: 3 / 5;
        }

        header {
            display: none;
            position: absolute;
            transform: rotate(270deg);
            z-index: 1;
            top: 290px;
            bottom: 120px;
            font-family: sans-serif;
        }

        main nav {
            width: 100%;
            transform: rotate(270deg);
            grid-row: 5 / 6;
            grid-column: 1 / 2;
            align-content: center;
            font-family: monospace;
        }

        .item7 {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
            padding-left: 20px;
            font-family: monospace;
        }

        .item7 a {
            position: relative;
            top: 20px;
            text-decoration: none;
            color: #000;
            font-family: monospace;
            font-size: 1.5rem;
        }

        .flex-item {
            display: flex;
            justify-content: space-between;
            align-items: end;
        }

        .shape-div {
            background-color: #8184d3;
            height: calc(100% + 40px);
            width: 70%;
            position: relative;
            top: 40px;
            border-radius: 0 30px 0 0;
            z-index: -1;
        }

        .small-shape {
            height: 100%;
            width: 30px;
            background-color: #8184d3;
            clip-path: polygon(72% 29%, 100% 0%, 100% 100%, 0% 100%);
            position: relative;
            left: -28px;
            border: none;
        }

        .item2 h2 {
            font-size: 6rem;
            font-family: monospace;
            margin: 0;
            text-align: center;
        }

        .item6 .sub-item1 {
            background-color: #A9DAD7;
            height: 50%;
            border-radius: 30px 30px 0 0;
            display: flex;
            justify-content: center;
            flex-direction: column;
            text-align: left;
            padding-inline: 30%;
        }

        .item6 .sub-item2 {
            color: #fff;
            background-color: #8E6FBD;
            height: 50%;
            border-radius: 0 0 30px 30px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            text-align: left;
            padding-inline: 30%;
        }

        .pink-circle {
            position: absolute;
            right: 10%;
            height: 200px;
            width: 200px;
            background-color: #E7ACF8;
            border-radius: 50%;
            border: 6px solid #fff;
        }

        .item1 {
            position: relative;
        }

        .pink-circle img {
            max-width: 100%;
            scale: 1.2;
        }

        svg {
            width: 15px;
        }

        .item1 .content {
            position: absolute;
            bottom: 10%;
            left: 10%;
        }

        .item1 h2 {
            font-size: 5rem;
            color: #fff;
            line-height: 0.9;
            margin-block-end: 0rem;
        }

        .item1 h2 span {
            font-weight: 100;
        }

        .item1 p {
            color: #fff;
            font-size: 1.2rem;
            border-bottom: 2px solid white;
        }

        .project-logo {
            position: absolute;
            bottom: 10%;
            right: 10%;
        }

        .project-logo img {
            width: 90px;
        }

        .item3 img,
        .item4 img,
        .item5 img {
            width: 100%;
            height: 100%;
        }

        .super-nav {
            background: #000;
            height: 50px;
            display: grid;
            place-items: center;
        }

        .super-nav a {
            color: #fff;
            font-size: 1.4rem;

        }

        .super-nav a:hover,
        .super-nav a:focus {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="super-nav">
        <a href="index.html">See the first design</a>
    </div>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="#">Podcast</a>
                </li>
                <li>
                    <a href="#">Portfolio</a>
                </li>
                <li>
                    <a href="#">Research</a>
                </li>
                <li>
                    <a href="#">Clients</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <nav>
            <ul>
                <li>
                    <a href="#">Podcast</a>
                </li>
                <li>
                    <a href="#">Portfolio</a>
                </li>
                <li>
                    <a href="#">Research</a>
                </li>
                <li>
                    <a href="#">Clients</a>
                </li>
            </ul>
        </nav>
        <div class="item1">
            <div class="pink-circle">
                <img src="./images/662401f716064b62585ff02d_About_Us_Image-Photoroom-removebg-preview.png" alt="">
            </div>
            <div class="content">
                <h2><span>Im,</span> <br>Jon<br>Daniel</h2>
                <p>Inquiry@jondaniel.design <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path
                            d="M21 3C21.5523 3 22 3.44772 22 4V20.0066C22 20.5552 21.5447 21 21.0082 21H2.9918C2.44405 21 2 20.5551 2 20.0066V19H20V7.3L12 14.5L2 5.5V4C2 3.44772 2.44772 3 3 3H21ZM8 15V17H0V15H8ZM5 10V12H0V10H5ZM19.5659 5H4.43414L12 11.8093L19.5659 5Z">
                        </path>
                    </svg></p>
            </div>
            <div class="project-logo">
                <img src="./images/project-shape-1-1.png" alt="">
            </div>
        </div>
        <div class="item2">
            <h2>Portfolio</h2>
        </div>
        <div class="item3">
            <img src="./images/video-content.png" alt="">
        </div>
        <div class="item4">
            <img src="./images/apple-logo.png" alt="">
        </div>
        <div class="item5">
            <img src="./images/globe-design.png" alt="">
        </div>
        <div class="item6">
            <div class="sub-item1">
                <p class="no">251</p>
                <p>Projects</p>
            </div>
            <div class="sub-item2">
                <p class="no">156</p>
                <p>Awards</p>
            </div>
        </div>
        <div class="item7 flex-item">
            <div class="nav-link">
                <a href="#">About me</a>
            </div>
            <div class="shape-div">
                <div class="small-shape"></div>
            </div>
        </div>
    </main>
</body>

</html>
